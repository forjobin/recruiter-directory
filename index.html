<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6">
    <div class="max-w-5xl mx-auto">
        
        <!-- HEADER SECTION -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4">
                <img src="facvicon.png" alt="Logo" class="w-14 h-14 rounded-lg object-contain border border-slate-100">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Recruiter Hotlist</h1>
                    <p class="text-sm text-slate-500 mt-0.5">Filter active recruitment professionals by location and experience.</p>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-4 text-center sm:text-right">
                <p class="text-xs sm:text-sm text-slate-600 max-w-xs">
                    Are you a recruiter? Get listed to expand your network and close positions faster.
                </p>
                <a href="https://tally.so/r/YOUR-TALLY-FORM-LINK" target="_blank" 
                   class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg shadow-sm text-sm transition-colors whitespace-nowrap">
                    Sign Up Now &rarr;
                </a>
            </div>
        </div>
        
        <!-- FILTER CONTROLS BAR -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- General Keyword Search -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Search Keyword</label>
                <input type="text" id="searchInput" placeholder="Search name or keywords..." 
                    class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Town / Location Filter Dropdown -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Filter by Town</label>
                <select id="townFilter" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Towns (Hinjewadi, Kharadi...)</option>
                    <!-- Options populated automatically by script -->
                </select>
            </div>

            <!-- Experience Range Filter Dropdown -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Filter by Experience</label>
                <select id="expFilter" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Experience Levels</option>
                    <option value="0-2">0 - 2 Years</option>
                    <option value="3-5">3 - 5 Years</option>
                    <option value="6-10">6 - 10 Years</option>
                    <option value="11+">11+ Years</option>
                </select>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden border border-slate-200">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Experience</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Town</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">City</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Profile</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-200" id="tableBody">
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-slate-400">Loading directory...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allData = [];

        async function loadDirectory() {
            try {
                const response = await fetch('data.json');
                allData = await response.json();
                populateTownDropdown(allData);
                renderTable(allData);
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-rose-500">Error loading data.json file.</td></tr>`;
            }
        }

        function populateTownDropdown(data) {
            const townSelect = document.getElementById('townFilter');
            // Extract unique towns
            const towns = [...new Set(data.map(row => row.Town).filter(Boolean))];
            
            towns.forEach(town => {
                const option = document.createElement('option');
                option.value = town;
                option.textContent = town;
                townSelect.appendChild(option);
            });
        }

        function renderTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">No matching entries found.</td></tr>`;
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors';
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-slate-900">${escapeHtml(row.name || '')}</td>
                    <td class="px-6 py-4 text-slate-600">${escapeHtml(String(row.experience || ''))} yrs</td>
                    <td class="px-6 py-4 text-slate-600"><span class="bg-blue-50 text-blue-700 px-2.5 py-1 rounded text-xs font-medium">${escapeHtml(row.Town || '')}</span></td>
                    <td class="px-6 py-4 text-slate-600">${escapeHtml(row.City || '')}</td>
                    <td class="px-6 py-4"><a href="${escapeHtml(row.linkedin || '#')}" target="_blank" class="text-blue-600 hover:text-blue-800 font-medium text-sm inline-flex items-center gap-1">LinkedIn &rarr;</a></td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function filterData() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedTown = document.getElementById('townFilter').value;
            const selectedExpRange = document.getElementById('expFilter').value;

            const filtered = allData.filter(row => {
                // 1. Keyword search match
                const matchesSearch = !searchQuery || Object.values(row).some(val => 
                    String(val).toLowerCase().includes(searchQuery)
                );

                // 2. Town dropdown match
                const matchesTown = !selectedTown || row.Town === selectedTown;

                // 3. Experience range match
                let matchesExp = true;
                if (selectedExpRange) {
                    const expNum = parseInt(row.experience, 10);
                    if (!isNaN(expNum)) {
                        if (selectedExpRange === "0-2") matchesExp = (expNum >= 0 && expNum <= 2);
                        else if (selectedExpRange === "3-5") matchesExp = (expNum >= 3 && expNum <= 5);
                        else if (selectedExpRange === "6-10") matchesExp = (expNum >= 6 && expNum <= 10);
                        else if (selectedExpRange === "11+") matchesExp = (expNum >= 11);
                    } else {
                        matchesExp = false;
                    }
                }

                return matchesSearch && matchesTown && matchesExp;
            });

            renderTable(filtered);
        }

        // Attach event listeners to all filters
        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('townFilter').addEventListener('change', filterData);
        document.getElementById('expFilter').addEventListener('change', filterData);

        loadDirectory();
    </script>
</body>
</html>
